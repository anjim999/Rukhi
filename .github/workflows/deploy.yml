name: Deploy to Hostinger (rukhi.in)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Auto Deploy to Hostinger via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '217.21.90.190' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u209580425' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script: |
            echo "🚀 Starting Hostinger deployment..."
            
            # Find and navigate to repository root
            if [ -d "/home/u209580425/domains/rukhi.in/public_html/.git" ]; then
              cd /home/u209580425/domains/rukhi.in/public_html
            elif [ -d "/home/u209580425/public_html/.git" ]; then
              cd /home/u209580425/public_html
            else
              cd $(find /home/u209580425 -name ".git" -type d 2>/dev/null | head -n 1 | xargs dirname)
            fi
            
            echo "📍 Deployment directory: $(pwd)"
            
            # Fetch latest commit from main
            git fetch origin main
            git reset --hard origin/main

            # Sync compiled frontend dist assets to web document roots
            if [ -d "frontend/dist" ]; then
              echo "📦 Syncing frontend/dist static assets..."
              cp -rf frontend/dist/* ./ 2>/dev/null || true
              if [ -d "/home/u209580425/domains/rukhi.in/public_html" ]; then
                cp -rf frontend/dist/* /home/u209580425/domains/rukhi.in/public_html/ 2>/dev/null || true
              fi
              if [ -d "/home/u209580425/public_html" ]; then
                cp -rf frontend/dist/* /home/u209580425/public_html/ 2>/dev/null || true
              fi
            fi
            
            # Restart Phusion Passenger Node.js server
            mkdir -p tmp
            touch tmp/restart.txt
            pkill -9 -f node || true
            
            echo "🎉 Deployment completed and Node.js server restarted successfully!"


