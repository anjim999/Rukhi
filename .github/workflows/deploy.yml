name: 🚀 Deploy rukhi.in to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Build Frontend (Vite Production Bundle)
        run: |
          cd frontend
          npm install
          npm run build
          echo "✅ Frontend build complete"
          ls -la dist/

      - name: 4. Package Frontend + Backend for Transfer
        run: |
          # Create a clean deployment archive
          mkdir -p deploy_package

          # Copy backend (exclude node_modules, dev files)
          rsync -av --exclude='node_modules' --exclude='.env' --exclude='uploads/*' --exclude='outputs/*' --exclude='storage/*' backend/ deploy_package/backend/

          # Copy frontend dist to both root public_html and frontend/dist
          mkdir -p deploy_package/frontend/dist
          cp -r frontend/dist/* deploy_package/frontend/dist/
          cp -r frontend/dist/* deploy_package/

          # Copy root entry files
          cp index.js deploy_package/
          cp app.js deploy_package/
          cp package.json deploy_package/
          cp .htaccess deploy_package/

          # Create the archive
          cd deploy_package
          tar -czf ../deploy.tar.gz .
          cd ..
          echo "✅ Deploy package created ($(du -sh deploy.tar.gz | cut -f1))"

      - name: 5. Transfer Deploy Package to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "deploy.tar.gz"
          target: "/home/${{ secrets.HOSTINGER_SSH_USER }}/domains/rukhi.in/public_html"
          overwrite: true

      - name: 6. Deploy on Hostinger Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            set -e
            DEPLOY_DIR="/home/${{ secrets.HOSTINGER_SSH_USER }}/domains/rukhi.in/public_html"
            cd "$DEPLOY_DIR"

            echo "📦 Step 1: Extract deploy package & remove Hostinger default files..."
            rm -f default.php default.html index.php 2>/dev/null || true
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz
            rm -f default.php default.html 2>/dev/null || true
            echo "✅ Files extracted and default placeholder files cleaned up"

            echo "📦 Step 2: Install backend production dependencies..."
            cd backend
            npm install --omit=dev 2>&1 || npm install 2>&1 || true
            cd ..
            echo "✅ Backend dependencies installed"

            echo "🔧 Step 3: Provision production .env..."
            echo "${{ secrets.PRODUCTION_ENV }}" > backend/.env
            echo "✅ Production .env created"

            echo "📂 Step 4: Ensure required directories exist..."
            mkdir -p tmp uploads outputs storage/logs backend/uploads backend/outputs

            echo "🔄 Step 5: Restart Passenger (Node.js app)..."
            touch tmp/restart.txt
            echo "✅ Passenger restart triggered"

            echo ""
            echo "🎉 Deployment complete!"
            echo "📍 Deploy dir: $DEPLOY_DIR"
            echo "📅 Deployed at: $(date)"

      - name: 7. Health Check
        run: |
          echo "🏥 Waiting 10 seconds for Passenger to restart..."
          sleep 10

          echo "Checking https://rukhi.in/api/health ..."
          HTTP_STATUS=$(curl -o /tmp/health_response.json -s -w "%{http_code}" --max-time 30 https://rukhi.in/api/health || echo "000")
          echo "Response Code: $HTTP_STATUS"

          if [ -f /tmp/health_response.json ]; then
            echo "Response Body:"
            cat /tmp/health_response.json
          fi

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo ""
            echo "✅ Health check PASSED! rukhi.in is live!"
          else
            echo ""
            echo "⚠️ Health check returned $HTTP_STATUS — site may need a few more seconds to start"
            echo "Check manually: https://rukhi.in/api/health"
          fi

      - name: 8. Cache Purge Verification
        run: |
          echo "🔍 Verifying frontend cache headers..."
          CACHE_HEADER=$(curl -s -I https://rukhi.in 2>/dev/null | grep -i "cache-control" || echo "No cache header found")
          echo "Cache-Control: $CACHE_HEADER"

          echo ""
          echo "✅ Deployment pipeline complete!"
          echo "🌐 Live at: https://rukhi.in"
