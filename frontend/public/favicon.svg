<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Matte Dark Titanium Base -->
    <radialGradient id="obsidian-bg" x1="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <!-- 24K Pure Gold Gradient -->
    <linearGradient id="pure-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Base Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#obsidian-bg)" stroke="#27272a" stroke-width="6" />

  <!-- Pure Ultra-Clean Small "r" Monogram -->
  <g transform="translate(140, 110)" filter="url(#gold-glow)">
    <!-- Vertical Pillar Stem -->
    <rect x="20" y="50" width="52" height="210" rx="26" fill="url(#pure-gold)" />

    <!-- Smooth Flowing Top Arch -->
    <path d="M 72 100 
             C 115 45, 195 45, 222 92 
             C 236 118, 226 148, 192 148 
             C 164 148, 152 120, 136 108 
             C 120 96, 96 96, 72 114 Z" 
          fill="url(#pure-gold)" />

    <!-- Subtitle Energy Dot (Top Right) -->
    <circle cx="212" cy="42" r="18" fill="#38bdf8" />
  </g>
</svg>
