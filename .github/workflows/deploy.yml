name: Production CI/CD Pipeline (Hostinger rukhi.in)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend & Backend
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v3

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 3. Install Frontend Dependencies & Build Vite Bundle
        run: |
          cd frontend
          npm install
          npm run build

      - name: 4. Sync Backend Code on Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '217.21.90.190' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u209580425' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script: |
            echo "🚀 Syncing backend repository code on Hostinger..."
            
            TARGET_DIR=""
            if [ -d "/home/u209580425/domains/rukhi.in/public_html/.git" ]; then
              TARGET_DIR="/home/u209580425/domains/rukhi.in/public_html"
            elif [ -d "/home/u209580425/public_html/.git" ]; then
              TARGET_DIR="/home/u209580425/public_html"
            else
              TARGET_DIR=$(find /home/u209580425 -name ".git" -type d 2>/dev/null | head -n 1 | xargs dirname)
            fi
            
            cd "$TARGET_DIR"
            echo "📍 Deployment directory: $(pwd)"
            
            # Ensure git origin URL is current
            git remote set-url origin https://github.com/anjim999/Rukhi.git 2>/dev/null || true
            
            git fetch origin main || true
            git reset --hard origin/main || true
            
            if [ -d "backend" ]; then
              echo "📦 Installing production dependencies for backend..."
              cd backend
              npm install --omit=dev || npm install || true
              cd ..
            fi

      - name: 5. Deploy Static Frontend Assets via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '217.21.90.190' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u209580425' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          source: "frontend/dist/*"
          target: "/home/u209580425/domains/rukhi.in/public_html"
          strip_components: 2
          overwrite: true

      - name: 6. Restart Hostinger Node.js Application Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '217.21.90.190' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u209580425' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script: |
            cd /home/u209580425/domains/rukhi.in/public_html 2>/dev/null || cd /home/u209580425/public_html
            echo "🔄 Triggering Phusion Passenger Node.js restart..."
            mkdir -p tmp
            touch tmp/restart.txt
            echo "🎉 Hostinger restart signal created successfully!"

      - name: 7. Automated Health Check
        run: |
          echo "🏥 Verifying production health check on https://rukhi.in..."
          sleep 5
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://rukhi.in || echo "000")
          echo "Production URL Response Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Production health check PASSED!"
          else
            echo "⚠️ Health check status code: $HTTP_STATUS"
          fi
