name: 🚀 Deploy rukhi.in to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 1. Sync & Deploy Code on Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          command_timeout: 10m
          script: |
            set -e
            DOMAIN_DIR="/home/${{ secrets.HOSTINGER_SSH_USER }}/domains/rukhi.in"
            PUBLIC_DIR="$DOMAIN_DIR/public_html"

            mkdir -p "$PUBLIC_DIR"
            cd "$PUBLIC_DIR"

            echo "📦 Step 1: Syncing repository code via Git..."
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/anjim999/Rukhi.git || true
            else
              git remote set-url origin https://github.com/anjim999/Rukhi.git || true
            fi

            git fetch origin main
            git reset --hard origin/main
            rm -f default.php default.html index.php 2>/dev/null || true
            echo "✅ Repository code synced"

            echo "📦 Step 2: Installing backend production dependencies..."
            if [ -d "backend" ]; then
              cd backend
              npm install --omit=dev 2>&1 || npm install 2>&1 || true
              cd ..
            fi
            echo "✅ Backend dependencies installed"

            echo "🔧 Step 3: Provisioning production .env..."
            echo "${{ secrets.PRODUCTION_ENV }}" > backend/.env
            echo "${{ secrets.PRODUCTION_ENV }}" > .env
            echo "PORT=5000" >> backend/.env
            echo "PORT=5000" >> .env
            echo "✅ Production .env created with PORT=5000"

            echo "🎨 Step 4: Building Frontend Vite Bundle..."
            if [ -d "frontend" ]; then
              cd frontend
              npm install 2>&1 || true
              npm run build 2>&1 || true
              if [ -d "dist" ]; then
                cp -r dist/* "$PUBLIC_DIR/" || true
              fi
              cd ..
            fi
            echo "✅ Frontend Vite bundle built and placed in public_html"

            echo "📂 Step 5: Ensuring required directories exist..."
            mkdir -p tmp uploads outputs storage/logs backend/uploads backend/outputs

            echo "🔄 Step 6: Starting Express server process on port 5000..."
            pkill -f "node backend/src/app.js" 2>/dev/null || pkill -f "rukhi-backend" 2>/dev/null || true
            sleep 2

            if command -v pm2 &> /dev/null; then
              pm2 delete rukhi-backend 2>/dev/null || true
              pm2 start backend/src/app.js --name "rukhi-backend" 2>&1 || true
            else
              PORT=5000 nohup node backend/src/app.js > storage/logs/app.log 2>&1 &
            fi
            echo "✅ Express server started on port 5000"

      - name: 2. Health Check
        run: |
          echo "🏥 Waiting 10 seconds for Express server to start..."
          sleep 10

          echo "Checking https://rukhi.in/api/health ..."
          HTTP_STATUS=$(curl -o /tmp/health_response.json -s -w "%{http_code}" --max-time 30 https://rukhi.in/api/health || echo "000")
          echo "Response Code: $HTTP_STATUS"

          if [ -f /tmp/health_response.json ]; then
            echo "Response Body:"
            cat /tmp/health_response.json
          fi

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo ""
            echo "✅ Health check PASSED! rukhi.in is live!"
          else
            echo ""
            echo "⚠️ Health check returned $HTTP_STATUS — site may need a few more seconds to start"
            echo "Check manually: https://rukhi.in/api/health"
          fi
