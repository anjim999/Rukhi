name: Deploy to Hostinger (rukhi.in)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Auto Deploy to Hostinger via API Webhook
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Hostinger Deployment Ping
        run: |
          echo "🚀 Triggering automated deployment for rukhi.in..."
          curl -s -X POST "https://rukhi.in/api/deploy-webhook" \
               -H "Authorization: Bearer ${{ secrets.HOSTINGER_API_TOKEN }}" \
               -H "Content-Type: application/json" \
               -d '{"ref": "refs/heads/main"}' || true
          echo "🎉 Deployment signal sent to Hostinger!"
