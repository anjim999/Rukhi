name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/node-mono@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies & Validate
        run: |
          cd backend
          npm ci
          npm run start -- --help || true

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build
