name: Production CI/CD Pipeline (Hostinger rukhi.in)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend & Backend
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v3

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 3. Install Frontend Dependencies & Build Vite Bundle Archive
        run: |
          cd frontend
          npm install
          npm run build
          cd dist
          tar -czf ../../dist.tar.gz .
          cd ../..

      - name: 4. Sync Backend Code & Provision Environment Variables on Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '217.21.90.190' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u209580425' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script: |
            echo "🚀 Syncing backend repository code on Hostinger..."
            
            TARGET_DIR=""
            if [ -d "/home/u209580425/domains/rukhi.in/public_html/.git" ]; then
              TARGET_DIR="/home/u209580425/domains/rukhi.in/public_html"
            elif [ -d "/home/u209580425/public_html/.git" ]; then
              TARGET_DIR="/home/u209580425/public_html"
            else
              TARGET_DIR=$(find /home/u209580425 -name ".git" -type d 2>/dev/null | head -n 1 | xargs dirname)
            fi
            
            cd "$TARGET_DIR"
            echo "📍 Deployment directory: $(pwd)"
            
            # Ensure git origin URL is current
            git remote set-url origin https://github.com/anjim999/Rukhi.git 2>/dev/null || true
            
            git fetch origin main || true
            git reset --hard origin/main || true

            # Auto-provision production .env on Hostinger for Neon PostgreSQL & Auth APIs
            echo "Tk9ERV9FTlY9cHJvZHVjdGlvbgpEQVRBQkFTRV9VUkw9cG9zdGdyZXNxbDovL25lb25kYl9vd25lcjpucGdfWWhSMnRKaWZXNXVRQGVwLWpvbGx5LWJ1dHRlcmZseS1heGdiMmIzZS1wb29sZXIuYy00LnVzLWVhc3QtMi5hd3MubmVvbi50ZWNoOjU0MzMvbmVvbmRiP3NzbG1vZGU9cmVxdWlyZQpKV1RfU0VDUkVUPWVncmRiaGZuYnNndmpvaWZha2ppZ252aW9laHJnaW9zZGpwbHNkbg==" | base64 -d > .env
            cp .env /home/u209580425/.env 2>/dev/null || true
            mkdir -p backend storage/logs
            cp .env backend/.env 2>/dev/null || true
            
            if [ -d "backend" ]; then
              echo "📦 Installing production dependencies for backend..."
              cd backend
              npm install --omit=dev || npm install || true
              cd ..
            fi

      - name: 5. Transfer Production Dist Archive via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '217.21.90.190' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u209580425' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          source: "dist.tar.gz"
          target: "/home/u209580425/domains/rukhi.in/public_html"
          overwrite: true

      - name: 6. Extract Production Bundle & Restart Application Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '217.21.90.190' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u209580425' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script: |
            TARGET_DIR="/home/u209580425/domains/rukhi.in/public_html"
            [ -d "$TARGET_DIR" ] || TARGET_DIR="/home/u209580425/public_html"
            cd "$TARGET_DIR"
            
            if [ -f "dist.tar.gz" ]; then
              echo "📦 Extracting new production static assets..."
              tar -xzf dist.tar.gz
              rm -f dist.tar.gz
              echo "✅ Extracted latest static assets successfully!"
            fi
            
            echo "🔄 Triggering Hostinger Node.js application restart..."
            mkdir -p tmp storage/logs
            touch tmp/restart.txt
            echo "🎉 Hostinger restart signal created successfully!"

      - name: 7. Automated Health Check
        run: |
          echo "🏥 Verifying production health check on https://rukhi.in..."
          sleep 5
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://rukhi.in || echo "000")
          echo "Production Response Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Production health check PASSED!"
          else
            echo "⚠️ Health check status code: $HTTP_STATUS"
          fi
